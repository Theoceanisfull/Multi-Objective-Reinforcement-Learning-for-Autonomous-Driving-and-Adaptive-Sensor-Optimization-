name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dqn.txt
            basic/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dqn.txt
      - name: Environment tests
        run: python -m unittest discover -s environments/tests -v
      - name: Experiment tests
        run: python -m unittest discover -s experiments/tests -v
